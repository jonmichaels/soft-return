# Experimental Windows build of the sr CLI. MANUAL TRIGGER ONLY
# (workflow_dispatch) — this repo deliberately runs no CI on push.
# The artifact is unverified: no Windows machine has run it. See README.
name: Windows sr (experimental)

on:
  workflow_dispatch:

jobs:
  windows-build:
    runs-on: windows-2022
    steps:
      - uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.3-release
          swift-build: 6.3-RELEASE
      - uses: actions/checkout@v4
      - run: git config --global core.protectNTFS false
      - name: Install static zlib (vcpkg)
        run: vcpkg install zlib:x64-windows-static
      - name: List vcpkg static libs (diagnostic)
        shell: pwsh
        run: Get-ChildItem "${env:VCPKG_INSTALLATION_ROOT}\installed\x64-windows-static\lib"
      - name: Build
        shell: pwsh
        run: swift build -c release --static-swift-stdlib --product sr -Xlinker "-L${env:VCPKG_INSTALLATION_ROOT}\installed\x64-windows-static\lib"
      - name: Collect exe and dependency report
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          $exe = Get-ChildItem .build -Recurse -Filter sr.exe | Select-Object -First 1
          if (-not $exe) { Write-Error "sr.exe not found under .build"; exit 1 }
          Write-Host "Found exe at $($exe.FullName)"
          Copy-Item $exe.FullName dist\sr.exe
          $dumpbin = Get-Command dumpbin.exe -ErrorAction SilentlyContinue
          if ($dumpbin) {
            & $dumpbin.Source /dependents dist\sr.exe | Out-File dist\DEPENDENCIES.txt
          } else {
            $vs = Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue | Where-Object FullName -like "*Hostx64\x64*" | Select-Object -First 1
            if ($vs) { & $vs.FullName /dependents dist\sr.exe | Out-File dist\DEPENDENCIES.txt }
            else { "dumpbin unavailable; dependency list not generated" | Out-File dist\DEPENDENCIES.txt }
          }
          Get-Content dist\DEPENDENCIES.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sr-windows-x86_64
          path: dist/
