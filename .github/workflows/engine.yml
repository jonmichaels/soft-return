# engine.yml
#
# Enforces the engine test suite (`swift test`) stays green on both
# platforms it ships to: Linux (inside the official swift:6.3.3 Docker
# image -- setup-swift@v2 cannot resolve Swift 6.3.x at all) and macOS (the system Xcode toolchain on macos-15, no
# extra setup — Package.swift's floor is macOS 10.15 / Swift tools
# 5.9, but CI validates against the toolchain the app actually builds
# with). Triggers only on source-shaped changes to keep noise down.
#
# FAILURE HERE IS SIGNAL. This gate should always be green.
name: engine

on:
  push:
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"

permissions:
  contents: read

jobs:
  test-linux:
    runs-on: ubuntu-latest
    container: swift:6.3.3
    steps:
      - uses: actions/checkout@v4

      - run: swift test

  test-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - run: swift test
