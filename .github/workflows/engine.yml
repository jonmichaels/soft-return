# engine.yml
#
# Enforces the engine test suite (`swift test`) stays green on both
# platforms it ships to: Linux (via swift-actions/setup-swift, pinned
# to Swift 6.3) and macOS (the system Xcode toolchain on macos-15, no
# extra setup — Package.swift's floor is macOS 10.15 / Swift tools
# 5.9, but CI validates against the toolchain the app actually builds
# with). Triggers only on source-shaped changes to keep noise down.
#
# FAILURE HERE IS SIGNAL. This gate should always be green.
name: engine

on:
  push:
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"

permissions:
  contents: read

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.3"

      - run: swift test

  test-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - run: swift test
